plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
    id 'jacoco'
}

group = 'com.skylink'
version = '0.0.1-SNAPSHOT'
description = 'skylink-backend'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation "org.springframework.boot:spring-boot-starter-validation"

    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2")

    implementation("org.springframework.boot:spring-boot-starter-websocket")

    implementation("com.google.firebase:firebase-admin:9.4.3")

    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation("org.mockito.kotlin:mockito-kotlin:5.2.1")
    mockitoAgent("org.mockito:mockito-core:5.20.0") {
        transitive = false
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation("com.google.api-client:google-api-client:2.0.0")
    implementation("com.google.oauth-client:google-oauth-client-jetty:1.34.1")
    implementation("com.google.api-client:google-api-client-gson:2.0.0")
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Xshare:off'
    jvmArgumentProviders.add(new org.gradle.process.CommandLineArgumentProvider() {
        @Override
        Iterable<String> asArguments() {
            ["-javaagent:${configurations.mockitoAgent.singleFile.absolutePath}"]
        }
    })
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = '0.8.13'
}

def jacocoBackendExcludes = [
        '**/SkylinkBackendApplication*',
        '**/config/AppDataSourceProperties*',
        '**/config/ChatWebSocketHandler*',
        '**/config/DataSourceConfig*',
        '**/config/FirebaseConfig*',
        '**/config/SecurityConfig*',
        '**/dto/**',
        '**/model/**',
        '**/repository/**',
        '**/service/JwtService*',
        '**/service/user/UserProfileService*',
        '**/*Interface*'
]

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: jacocoBackendExcludes)
    }))
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn test
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: jacocoBackendExcludes)
    }))
    violationRules {
        rule {
            element = 'BUNDLE'
            ['INSTRUCTION', 'BRANCH', 'LINE', 'COMPLEXITY', 'METHOD', 'CLASS'].each { counterName ->
                limit {
                    counter = counterName
                    value = 'COVEREDRATIO'
                    minimum = 1.0
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}
